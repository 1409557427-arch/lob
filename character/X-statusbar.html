<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<style>
/* === 色彩变量 (深红夜幕) === */
:root {
  --bg-primary: #0a0608;
  --bg-card: #1a0e12;
  --bg-card-hover: #24141a;
  --bg-input: #12090d;
  --text-primary: #e8d0d0;
  --text-secondary: #b59090;
  --text-muted: #7d6065;
  --accent: #c94c4c;
  --accent-light: #e88080;
  --accent-dark: #8a3030;
  --border: #3d2828;
  --danger: #e04040;
  --warning: #d4a040;
  --success: #40a070;
  --info: #5088c8;
  /* 文本 */
  --fs-xs:  clamp(10px, 2vw, 11px);
  --fs-sm:  clamp(11px, 2.2vw, 12px);
  --fs-base: clamp(12px, 2.5vw, 14px);
  --fs-md:  clamp(13px, 2.8vw, 15px);
  --fs-lg:  clamp(15px, 3.2vw, 18px);
  /* 间距 */
  --space-xs:  clamp(4px, 1vw, 8px);
  --space-sm:  clamp(8px, 2vw, 12px);
  --space-md:  clamp(12px, 3vw, 16px);
  --safe-top:    env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left:   env(safe-area-inset-left, 0px);
  --safe-right:  env(safe-area-inset-right, 0px);
}

/* === 基础重置 === */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{
  background:var(--bg-primary);
  color:var(--text-primary);
  font-family:'Noto Serif SC','Source Han Serif SC','SimSun',serif;
  min-height:100vh;min-height:100dvh;
  display:flex;justify-content:center;
  line-height:1.5;overflow-x:hidden;
  padding:var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
}

/* === 布局 === */
.container{
  position:relative;width:100%;max-width:640px;
  min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;
  padding:var(--space-md);
}
.header{
  display:flex;flex-direction:column;align-items:center;
  padding:var(--space-lg) 0 var(--space-md);
  border-bottom:1px solid var(--border);
  margin-bottom:var(--space-md);
}
.facility-title{
  font-size:var(--fs-md);color:var(--text-muted);
  letter-spacing:0.15em;text-transform:uppercase;
  margin-bottom:var(--space-xs);
}
.branch-label{
  font-size:var(--fs-lg);font-weight:700;color:var(--text-primary);
}
.logo-decor{
  display:flex;align-items:center;gap:var(--space-sm);
  margin:var(--space-sm) 0;
}
.logo-decor svg{opacity:0.6;width:36px;height:36px;color:var(--accent)}

/* === 数据面板 === */
.panels{
  display:flex;flex-direction:column;gap:var(--space-sm);
  flex:1;
}
.card{
  background:var(--bg-card);border:1px solid var(--border);
  border-radius:4px;padding:var(--space-sm) var(--space-md);
  display:flex;flex-direction:column;gap:var(--space-xs);
}
.card-header{
  display:flex;justify-content:space-between;align-items:center;
  font-size:var(--fs-xs);color:var(--text-muted);
  text-transform:uppercase;letter-spacing:0.12em;
  border-bottom:1px solid var(--border);
  padding-bottom:var(--space-xs);
}
.card-value{
  font-size:var(--fs-lg);font-weight:700;
  font-family:'Courier New',monospace;
}

/* === 能量进度条 === */
.progress-bar{
  width:100%;height:clamp(6px,1.2vw,8px);
  background:var(--bg-input);border-radius:3px;overflow:hidden;
  margin-top:var(--space-xs);
}
.progress-fill{
  height:100%;background:var(--success);border-radius:3px;
  transition:width 0.5s;
}
.progress-fill.warning{background:var(--warning)}
.progress-fill.danger{background:var(--danger)}

/* === 统计网格 === */
.stat-row{
  display:flex;gap:var(--space-sm);
}
.stat-box{
  flex:1;background:var(--bg-card);border:1px solid var(--border);
  border-radius:4px;padding:var(--space-sm) var(--space-sm);
  text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:2px;
}
.stat-label{
  font-size:var(--fs-xs);color:var(--text-muted);
  text-transform:uppercase;letter-spacing:0.08em;
}
.stat-num{
  font-size:var(--fs-lg);font-weight:700;
  font-family:'Courier New',monospace;
}
.stat-sub{
  font-size:var(--fs-xs);color:var(--text-secondary);
}

/* === 警报指示器 === */
.trumpet-indicator{
  display:flex;align-items:center;gap:var(--space-sm);
  padding:var(--space-sm) var(--space-md);
  border-radius:4px;
  font-size:var(--fs-base);font-weight:700;
  text-transform:uppercase;letter-spacing:0.15em;
}
.trumpet-0{border:1px solid var(--border);color:var(--text-muted)}
.trumpet-1{border:1px solid var(--warning);color:var(--warning);background:rgba(212,160,64,0.08)}
.trumpet-2{border:1px solid var(--danger);color:var(--danger);background:rgba(224,64,64,0.1)}
.trumpet-3{border:1px solid var(--danger);color:#fff;background:rgba(224,64,64,0.2);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}

/* === 异想体列表 === */
.abno-list{
  display:flex;flex-direction:column;gap:1px;
}
.abno-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:var(--space-xs) var(--space-sm);
  background:var(--bg-input);border-radius:2px;
  font-size:var(--fs-sm);
}
.abno-risk{
  font-size:var(--fs-xs);font-weight:700;letter-spacing:0.1em;
  padding:1px 6px;border-radius:2px;
}
.risk-ZAYIN{color:var(--success);border:1px solid var(--success)}
.risk-TETH{color:var(--warning);border:1px solid var(--warning)}
.risk-HE{color:var(--danger);border:1px solid var(--danger)}
.risk-WAW{color:#c060e0;border:1px solid #c060e0}
.risk-ALEPH{color:#ff4040;border:1px solid #ff4040;animation:pulse 1s infinite}

/* === 代理装备卡片 === */
.agent-cards{display:flex;flex-direction:column;gap:var(--space-sm)}
.agent-card{background:var(--bg-card);border:1px solid var(--border);border-radius:4px;padding:var(--space-sm) var(--space-md)}
.agent-name-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-xs);border-bottom:1px solid var(--border);padding-bottom:var(--space-xs)}
.agent-name{font-size:var(--fs-sm);font-weight:700;color:var(--text-primary)}
.agent-status{font-size:var(--fs-xs);padding:1px 8px;border-radius:2px;text-transform:uppercase}
.status-idle{border:1px solid var(--border);color:var(--text-muted)}
.status-working{border:1px solid var(--success);color:var(--success)}
.status-panicked{border:1px solid var(--danger);color:var(--danger);animation:pulse 0.8s infinite}
.status-dead{border:1px solid #666;color:#666;text-decoration:line-through}
.equip-row{display:flex;gap:var(--space-sm);font-size:var(--fs-xs)}
.equip-label{color:var(--text-muted);min-width:28px;flex-shrink:0}
.equip-name{color:var(--text-secondary)}
.equip-grade{font-weight:700;margin-left:4px;font-size:var(--fs-xs)}
.grade-ZAYIN{color:var(--success)}.grade-TETH{color:var(--warning)}.grade-HE{color:var(--danger)}
.grade-WAW{color:#c060e0}.grade-ALEPH{color:#ff4040}
.virtue-row{display:flex;gap:var(--space-xs);margin-top:var(--space-xs)}
.virtue-dot{flex:1;text-align:center;font-size:var(--fs-xs);padding:2px 0;border-radius:2px;background:var(--bg-input)}
.virtue-dot .v-label{color:var(--text-muted);font-size:9px;text-transform:uppercase}
.virtue-dot .v-val{color:var(--text-primary);font-size:var(--fs-sm);font-family:'Courier New',monospace}
.ego-inv-header{display:flex;justify-content:space-between;color:var(--text-muted);font-size:var(--fs-xs);margin-top:var(--space-sm);padding-top:var(--space-xs);border-top:1px solid var(--border)}
.ego-inv-item{font-size:var(--fs-xs);color:var(--text-secondary);padding:1px 0;display:flex;gap:var(--space-sm)}
.ego-inv-item .inv-grade{font-weight:700;min-width:36px}

/* === 响应式 === */
@media(max-width:360px){
  .stat-row{flex-wrap:wrap}
  .stat-box{min-width:45%}
  .equip-row{flex-direction:column;gap:2px}
}
@media(max-height:480px) and (orientation:landscape){
  .header{padding:var(--space-xs) 0}
  .logo-decor{display:none}
  .panels{gap:var(--space-xs)}
  .card{padding:var(--space-xs) var(--space-sm)}
  .agent-cards{flex-direction:row;flex-wrap:wrap}
  .agent-card{flex:1;min-width:180px}
}
@media(min-width:768px){
  .stat-row{gap:var(--space-md)}
  .agent-cards{flex-direction:row;flex-wrap:wrap}
  .agent-card{flex:1;min-width:200px}
}
@media(min-width:1024px){
  .container{max-width:680px}
}
@media(prefers-reduced-motion:reduce){
  .trumpet-3,.risk-ALEPH,.status-panicked{animation:none !important}
}
</style>
</head>
<body>
<div class="container">

  <!-- 头部 -->
  <div class="header">
    <div class="facility-title">Lobotomy Corporation</div>
    <div class="branch-label">Branch 47 — 主管办公室</div>
    <div class="logo-decor">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="2" x2="12" y2="22"/>
        <line x1="2" y1="12" x2="22" y2="12"/>
        <circle cx="12" cy="12" r="4"/>
      </svg>
      <span style="font-size:var(--fs-sm);color:var(--text-muted);letter-spacing:0.2em">FACE THE FEAR, BUILD THE FUTURE</span>
    </div>
  </div>

  <!-- 面板 -->
  <div class="panels">

    <!-- 警报状态 -->
    <div id="trumpet-panel" class="trumpet-indicator trumpet-0">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <span id="trumpet-text">STATUS: NORMAL</span>
    </div>

    <!-- 能量 -->
    <div class="card">
      <div class="card-header">
        <span>能量收集</span>
        <span style="color:var(--success)">PE-Box</span>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:flex-end">
        <span class="card-value" style="color:var(--success)" id="energy-val">0</span>
        <span style="font-size:var(--fs-xs);color:var(--text-muted)">/ 配额 <span id="quota-val">200</span></span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="energy-bar" style="width:0%"></div>
      </div>
    </div>

    <!-- 统计行 -->
    <div class="stat-row">
      <div class="stat-box">
        <div class="stat-label">Agents</div>
        <div class="stat-num" style="color:var(--info)" id="agents-num">3</div>
        <div class="stat-sub">在岗代理</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Clerks</div>
        <div class="stat-num" style="color:var(--text-muted)" id="clerks-num">0</div>
        <div class="stat-sub">文职在岗</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Deaths</div>
        <div class="stat-num" style="color:var(--danger)" id="deaths-num">0</div>
        <div class="stat-sub">本日死亡</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Day</div>
        <div class="stat-num" style="color:var(--accent-light)" id="day-num">1</div>
        <div class="stat-sub">工作日</div>
      </div>
    </div>

    <!-- 异想体 -->
    <div class="card">
      <div class="card-header">
        <span>收容单元</span>
        <span id="abno-count" style="color:var(--text-secondary)">3 异想体</span>
      </div>
      <div class="abno-list" id="abno-list">
        <div class="abno-row"><span>O-01-04</span><span class="abno-risk risk-ZAYIN">ZAYIN</span><span style="color:var(--text-muted);font-size:var(--fs-xs)">Q: --</span></div>
        <div class="abno-row"><span>O-02-11</span><span class="abno-risk risk-TETH">TETH</span><span style="color:var(--text-muted);font-size:var(--fs-xs)">Q: --</span></div>
        <div class="abno-row"><span>O-03-17</span><span class="abno-risk risk-HE">HE</span><span style="color:var(--text-muted);font-size:var(--fs-xs)">Q: --</span></div>
      </div>
    </div>

    <!-- 代理装备 -->
    <div class="card">
      <div class="card-header">
        <span>代理 E.G.O. 状态</span>
        <span id="agent-count" style="color:var(--text-secondary)">3 人在岗</span>
      </div>
      <div class="agent-cards" id="agent-cards">
        <!-- JS 动态生成 -->
      </div>
    </div>

    <!-- E.G.O. 库存 -->
    <div class="card">
      <div class="card-header">
        <span>E.G.O. 装备库</span>
        <span style="color:var(--text-muted)">已提取原型</span>
      </div>
      <div id="ego-weapons-slot" style="font-size:var(--fs-xs);color:var(--text-secondary);padding:2px 0">
      </div>
      <div id="ego-suits-slot" style="font-size:var(--fs-xs);color:var(--text-secondary);padding:2px 0">
      </div>
      <div id="ego-empty-slot" style="font-size:var(--fs-xs);color:var(--text-secondary);text-align:center;padding:var(--space-sm) 0">
        尚未提取任何 E.G.O. 装备。使用 PE-Box 解锁异想体信息后可提取原型。
      </div>
    </div>

  </div> <!-- /panels -->
</div> <!-- /container -->

<script>
// === 全局状态 ===
var facilityData = {};
var INTERVAL_MS = 2000;

// === SVG 图标 ===
function makeIcon(pathData) {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;display:inline-block;vertical-align:middle;margin-right:4px">'+pathData+'</svg>';
}

// === 更新 Trumpet 显示 ===
function updateTrumpet(level) {
  var panel = document.getElementById('trumpet-panel');
  var text = document.getElementById('trumpet-text');
  var labels = ['STATUS: NORMAL','FIRST TRUMPET','SECOND TRUMPET','THIRD TRUMPET','FOURTH TRUMPET','FIFTH TRUMPET','SIXTH TRUMPET','SEVENTH TRUMPET'];
  panel.className = 'trumpet-indicator trumpet-' + (level > 3 ? 3 : level);
  text.textContent = labels[level] || 'STATUS: NORMAL';
  if (level > 0) {
    text.textContent += '  ALERT';
  }
}

// === 更新能量条 ===
function updateEnergy(collected, quota) {
  var pct = quota > 0 ? Math.min(100, Math.round(collected / quota * 100)) : 0;
  var bar = document.getElementById('energy-bar');
  var val = document.getElementById('energy-val');
  bar.style.width = pct + '%';
  val.textContent = collected;
  bar.className = 'progress-fill' + (pct >= 100 ? '' : pct < 30 ? ' danger' : pct < 60 ? ' warning' : '');
}

// === 主刷新函数 ===
function refresh() {
  try {
    if (typeof Mvu !== 'undefined' && typeof Mvu.getMvuData === 'function') {
      var raw = Mvu.getMvuData({ type: 'message', message_id: 0 });
      if (raw && raw.stat_data) {
        facilityData = raw.stat_data;
      }
    }
  } catch(e) {
    // 非酒馆环境，使用默认静态数据
  }

  var f = facilityData.facility || { energy_quota: 200, energy_collected: 0 };
  var e = facilityData.emergency || { trumpet_level: 0, breached_count: 0 };
  var emp = facilityData.employees || { agents_active: 3, clerks_active: 0, deaths_today: 0 };
  var ab = facilityData.abnormalities || { total_count: 3, by_risk: { ZAYIN:1,TETH:1,HE:1,WAW:0,ALEPH:0 } };
  var p = facilityData.progress || { day: 1, completed_days: 0, total_deaths: 0 };
  var agents = facilityData.agents || {};
  var inv = facilityData.ego_inventory || { weapons: [], suits: [] };

  // 各项更新
  updateTrumpet(e.trumpet_level || 0);
  updateEnergy(f.energy_collected || 0, f.energy_quota || 1);
  document.getElementById('quota-val').textContent = f.energy_quota || 200;
  document.getElementById('agents-num').textContent = emp.agents_active || 0;
  document.getElementById('clerks-num').textContent = emp.clerks_active || 0;
  document.getElementById('deaths-num').textContent = emp.deaths_today || 0;
  document.getElementById('day-num').textContent = p.day || 1;
  document.getElementById('abno-count').textContent = (ab.total_count || 0) + ' 异想体';
  document.getElementById('agent-count').textContent = (emp.agents_active || 0) + ' 人在岗';

  // 异想体列表
  var riskOrder = ['ALEPH','WAW','HE','TETH','ZAYIN'];
  var items = [];
  for (var ri = 0; ri < riskOrder.length; ri++) {
    var risk = riskOrder[ri];
    var count = (ab.by_risk && ab.by_risk[risk]) ? ab.by_risk[risk] : 0;
    for (var ci = 0; ci < count; ci++) {
      items.push('<div class="abno-row"><span>--</span><span class="abno-risk risk-'+risk+'">'+risk+'</span><span style="color:var(--text-muted);font-size:var(--fs-xs)">Q: --</span></div>');
    }
  }
  document.getElementById('abno-list').innerHTML = items.length > 0 ? items.join('') : '<div style="font-size:var(--fs-xs);color:var(--text-muted);text-align:center;padding:12px">No abnormalities contained</div>';

  // 代理装备卡片
  renderAgentCards(agents);

  // E.G.O. 库存
  renderInventory(inv);
}

// === 渲染代理卡片 ===
function renderAgentCards(agents) {
  var agentKeys = Object.keys(agents);
  var html = [];
  for (var i = 0; i < agentKeys.length; i++) {
    var a = agents[agentKeys[i]];
    if (!a || a.status === 'absent') continue;

    var statusClass = 'status-' + (a.status || 'idle');
    var statusLabel = {idle:'待命',working:'工作中',panicked:'恐慌',dead:'已死亡'}[a.status] || '待命';
    var wp = a.weapon || { name:'未装备', grade:'无', damage_type:'无' };
    var st = a.suit || { name:'基础制服', grade:'无' };

    html.push(
      '<div class="agent-card">' +
      '<div class="agent-name-row">' +
      '<span class="agent-name">' + (a.name || 'Unknown') + '</span>' +
      '<span class="agent-status ' + statusClass + '">' + statusLabel + '</span>' +
      '</div>' +
      '<div class="equip-row">' +
      '<span class="equip-label">武器</span>' +
      '<span class="equip-name">' + wp.name + '<span class="equip-grade grade-' + (wp.grade||'无') + '"> ' + (wp.grade||'无') + '</span><span style="color:var(--text-muted);margin-left:4px">' + (wp.damage_type||'') + '</span></span>' +
      '</div>' +
      '<div class="equip-row">' +
      '<span class="equip-label">防具</span>' +
      '<span class="equip-name">' + st.name + '<span class="equip-grade grade-' + (st.grade||'无') + '"> ' + (st.grade||'无') + '</span></span>' +
      '</div>' +
      renderVirtues(a) +
      '</div>'
    );
  }
  document.getElementById('agent-cards').innerHTML = html.join('');
}

// === 渲染四维 ===
function renderVirtues(a) {
  var virtues = [
    { key: 'FORT', label: 'F', val: a.virtue_fortitude || 1 },
    { key: 'PRUD', label: 'P', val: a.virtue_prudence || 1 },
    { key: 'TEMP', label: 'T', val: a.virtue_temperance || 1 },
    { key: 'JUST', label: 'J', val: a.virtue_justice || 1 }
  ];
  var bars = [];
  for (var i = 0; i < virtues.length; i++) {
    var v = virtues[i];
    bars.push(
      '<div class="virtue-dot">' +
      '<div class="v-label">' + v.key + '</div>' +
      '<div class="v-val">Lv.' + v.val + '</div>' +
      '</div>'
    );
  }
  return '<div class="virtue-row">' + bars.join('') + '</div>';
}

// === 渲染 E.G.O. 库存 ===
function renderInventory(inv) {
  var weapons = inv.weapons || [];
  var suits = inv.suits || [];
  var wHtml = [];
  var sHtml = [];

  for (var i = 0; i < weapons.length; i++) {
    var w = weapons[i];
    wHtml.push(
      '<div class="ego-inv-item">' +
      '<span class="inv-grade grade-' + (w.grade||'ZAYIN') + '">' + (w.grade||'') + '</span>' +
      '<span>' + (w.name||'') + '</span>' +
      '<span style="color:var(--text-muted);margin-left:auto">' + (w.damage_type||'') + ' | 需' + (w.required_virtue||'') + ' Lv.' + (w.required_level||1) + '</span>' +
      '</div>'
    );
  }
  for (var j = 0; j < suits.length; j++) {
    var st = suits[j];
    sHtml.push(
      '<div class="ego-inv-item">' +
      '<span class="inv-grade grade-' + (st.grade||'ZAYIN') + '">' + (st.grade||'') + '</span>' +
      '<span>' + (st.name||'') + '</span>' +
      '<span style="color:var(--text-muted);margin-left:auto">R:' + Number(st.resist_red||1).toFixed(1) + ' W:' + Number(st.resist_white||1).toFixed(1) + ' B:' + Number(st.resist_black||1).toFixed(1) + ' P:' + Number(st.resist_pale||1).toFixed(1) + '</span>' +
      '</div>'
    );
  }

  document.getElementById('ego-weapons-slot').innerHTML = weapons.length > 0 ? '<div style="font-size:var(--fs-xs);color:var(--text-muted);padding-bottom:2px">[武器]</div>' + wHtml.join('') : '';
  document.getElementById('ego-suits-slot').innerHTML = suits.length > 0 ? '<div style="font-size:var(--fs-xs);color:var(--text-muted);padding-bottom:2px">[防具]</div>' + sHtml.join('') : '';
  document.getElementById('ego-empty-slot').style.display = (weapons.length === 0 && suits.length === 0) ? 'block' : 'none';
}

// === 初始化 ===
function init() {
  refresh();
  setInterval(refresh, INTERVAL_MS);
}
document.addEventListener('DOMContentLoaded', init);
if (document.readyState !== 'loading') init();
</script>
</body>
</html>
